name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.suite }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # git.anuna.io currently provides the ubuntu-22.04 runner label.
        # Keep every required gate schedulable on that runner fleet.
        include:
          - os: ubuntu-22.04
            suite: core
          - os: ubuntu-22.04
            suite: image
          - os: ubuntu-22.04
            suite: spec-014
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SBCL (Linux)
        run: |
          if [ "$(id -u)" -eq 0 ]; then
            apt-get update
            apt-get install -y sbcl libffi-dev
          else
            sudo apt-get update
            sudo apt-get install -y sbcl libffi-dev
          fi

      - name: Install Quicklisp
        run: |
          curl -O https://beta.quicklisp.org/quicklisp.lisp
          sbcl --non-interactive --no-userinit --no-sysinit \
               --load quicklisp.lisp \
               --eval '(quicklisp-quickstart:install)'

      - name: Run core tests (M1–M5, M8, M10)
        if: matrix.suite == 'core'
        run: |
          bash bin/run-tests.sh m1
          bash bin/run-tests.sh m2
          bash bin/run-tests.sh m3
          bash bin/run-tests.sh m4
          bash bin/run-tests.sh m5
          bash bin/run-tests.sh m8
          bash bin/run-tests.sh m10

      - name: Run image tests (M9, M11)
        if: matrix.suite == 'image'
        run: |
          bash bin/run-tests.sh m9
          bash bin/run-tests.sh m11

      - name: Run SPEC-014 safety and plugin gates
        if: matrix.suite == 'spec-014'
        run: |
          bash bin/run-tests.sh m12
          bash bin/run-tests.sh openrouter
          bash bin/run-tests.sh evolution

      - name: Run scaffolded-runtime gate
        if: matrix.suite == 'spec-014'
        run: bash bin/test-scaffolder.sh

  loc-budget:
    name: LOC budget audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Count harness LOC (excluding tests/examples/deps)
        run: |
          total=$(wc -l \
            src/agent.lisp src/builtin-tools.lisp src/cbcl-ffi.lisp \
            src/fileops-tools.lisp \
            src/gateway.lisp src/hooks.lisp \
            src/mailbox.lisp src/main.lisp \
            src/packages.lisp src/producer-gateway.lisp src/reasoner.lisp \
            src/receipt-log.lisp src/save-image.lisp src/supervisor.lisp \
            src/tools.lisp src/turn-loop.lisp src/wss-transport.lisp \
            src/providers/stub.lisp src/providers/anthropic.lisp \
            | tail -1 | awk '{print $1}')
          echo "Harness LOC: $total"
          # Match the M11 core-harness budget (identity remains a separate tier).
          if [[ "$total" -ge 3700 ]]; then
            echo "::error::Harness LOC ($total) exceeds 3700 cap — trim before merge"
            exit 1
          fi
